services:
  mysql:
    image: mysql:8.0
    container_name: voki-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: voki
      MYSQL_USER: voki
      MYSQL_PASSWORD: voki
      MYSQL_ROOT_PASSWORD: voki
    ports:
      - "3306:3306"
    volumes:
      - voki_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvoki"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  voki_mysql_data:
