[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev && if [ -z \"$DATABASE_URL\" ]; then export DATABASE_URL=\"mysql://build:build@127.0.0.1:3306/voki\"; fi && npm run build && npm prune --omit=dev"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
