services:
  - type: web
    name: voki
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: admin@voki.local
      - key: SUPER_ADMIN_PASSWORD
        value: VokiAdmin2026
      - key: SUPER_ADMIN_FIRST_NAME
        value: Voki
      - key: SUPER_ADMIN_LAST_NAME
        value: Admin
